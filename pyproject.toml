[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "so101-sim"
version = "0.1.0"
description = "SO-101 MuJoCo pick-and-place training and camera bridge"
requires-python = ">=3.10"
dependencies = [
  "mujoco>=3.3,<4",
  "gymnasium>=1.1,<2",
  "stable-baselines3>=2.6,<3",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
  "Pillow>=11,<13",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "imageio>=2.37,<3",
  "imageio-ffmpeg>=0.6,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["so101_sim*"]

[tool.setuptools.package-data]
so101_sim = ["model/*.xml", "model/*.md", "model/LICENSE-*", "model/assets/*.stl"]

[project.scripts]
so101-train = "so101_sim.train:main"
so101-eval = "so101_sim.evaluate:main"
so101-demo = "so101_sim.demo:main"
so101-serve = "so101_sim.server:main"
so101-calibrate-camera = "so101_sim.calibrate_camera:main"
so101-expert-demo = "so101_sim.expert_demo:main"
so101-teleop = "so101_sim.teleop:main"
so101-collect-lerobot = "so101_sim.collect_lerobot:main"
so101-eval-lerobot = "so101_sim.eval_lerobot:main"
so101-eval-expert = "so101_sim.eval_expert:main"
so101-teleop-lerobot = "so101_sim.teleop_lerobot:main"
