[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roboarm-drawing"
version = "0.2.0"
description = "SO-101 drawing models, simulation assets, and voice feedback workflows"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "matplotlib>=3.8,<4",
  "mujoco>=3.3,<4",
  "opencv-python-headless>=4.10,<5",
  "Pillow>=11,<13",
  "imageio>=2.37,<3",
  "imageio-ffmpeg>=0.6,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
voice = ["elevenlabs[pyaudio]"]

[tool.setuptools.packages.find]
include = ["so101_sim*"]

[tool.setuptools.package-data]
so101_sim = ["model/*.xml", "model/*.md", "model/LICENSE-*", "model/assets/*.stl"]
